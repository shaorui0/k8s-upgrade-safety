faults:
- id: F1
  cluster: prod-east
  kind: raft_lag
  what: one etcd follower is 2000 entries behind the leader
  expect_stop: check
  criterion: etcd_raft_lag
- id: F2
  cluster: prod-south
  kind: ccm_unhealthy
  what: the target cloud-controller-manager rollout is unhealthy (would strand new workers on the uninitialized
    taint)
  expect_stop: addon:ccm
- id: F3
  cluster: prod-west
  kind: pdb_blocks_drain
  what: a stateful node's PDB allows zero disruptions
  expect_stop: workers:canary
- id: F4
  cluster: prod-eu
  kind: slow_eviction
  what: a node evicts in 540 s but the cluster has no drain_timeout_s=600 flag
  expect_stop: workers:batch
- id: F5
  cluster: prod-north
  kind: apiserver_not_ready
  what: second master's apiserver fails /readyz and LB membership after upgrade
  expect_stop: master:prod-north-m2:apiserver_ready
